<style>
body {
    overflow: hidden;
}

#member-list {
    display: flex;
    flex-wrap: wrap;
    padding-left: 0
}
#member-list li {
    display: block;
    background: #eee;
    margin: .25em;
    padding: .25em;
    flex: 1 0 auto;
    border-radius: .25em;
    font-size: .8em;
}
#member-list li span {
    vertical-align: middle;
}
#game {
    position: absolute;
    right: 0px;
    width: 80%;
    height: 100%;
}

#controller {
    position: absolute;
    height: 100%;
    width: 20%;
    left: 0px;
    top: 0px;
    display: flex;
    flex-direction: column;
    z-index: 20;
}

#controller .panel-heading {
    flex: 1;
}
#controller .panel-body {
    display: flex;
    flex-direction: column;
    flex-grow: 100;
}
.panel-tab {
    height: 100%;
    display: flex;
    flex-direction: column;
    flex: 1;
}

#enter-area {
    position: absolute;
    left: 0%;
    top: 0%;
    width: 100%;
    height: 100%;
    z-index: 9999;
    background: rgba(0,0,0,.6);
}
#enter-area .card {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    margin: auto;
    width: 90%;
    height: 90%;
    background: #ababab;
    opacity: 0.8;
}

#login-form {
    display: flex;
    flex-direction: column;
    height: 100%;
}

#login-form h1 {
    flex: 0;
}

#login-form .name-input,.character-input {
    flex: 0;
}
#login-form .character-input { padding: 6px 0; }
#login-form .character { border-radius: 3px }

#login-form .character-input {
    overflow: scroll;
    flex: 1;
}

#login-form .button-area {
    flex: 0;
}

.character {
    border: 3px solid transparent;
    background-repeat: no-repeat;
    background-position: -35px -35px!important;
    display: inline-block;
    cursor: pointer;
    width: 32px;
    height: 32px;
}
.character.choosed {
    border: 3px solid blue;
}

@media only screen and (max-height: 500px){ /* narrow */
	#controller ul.nav { display: none; }
	#log-area { display: none; }
    #name { display: inline; width: auto; }
    #login-form h1 { font-size: 2rem; }
    #manual-area { display: none; }
}

@media only screen and (max-width: 400px){ /* wide */
	#controller ul.nav { display: none; }
	#controller .card-header { display: none; }
	#log-area { display: none; }
	#controller {

		height: 20%;
	}
	#game {
		top: 20%;
		width: 100%;
		height: 80%;
	}
}

#arrow-controller img {

    -ms-touch-callout: none;
    -moz-touch-callout: none;
    -o-touch-callout: none;
    touch-callout: none;
}
.nav-item {
    font-size: .85em;
}
.nav-item .nav-link {
    padding: .3rem .6rem;
}

<script>
let connection = null;
let room = null;
var members = {};
var my_user_id = null;

function connectWebSocket() {
    var ws = new WebSocket('wss://chatroom.openfun.app/ws');

    ws.onopen = function() {
        ws.send(JSON.stringify({
            type: 'join',
            room: room_id,
            username: $('#name').val(),
            meta: {
                character: $('#character .character.choosed').data('character'),
                top: parseInt(Game.heroes.me.y),
                left: parseInt(Game.heroes.me.x),
            }
        }));

        room = {
            participants: new Proxy(members, {
                get: function(target, id) {
                    var m = target[id];
                    if (!m) return undefined;
                    return {
                        getProperty: function(key) { return (m.meta || {})[key]; },
                        getDisplayName: function() { return m.username; },
                    };
                }
            }),
            setDisplayName: function(name) {
                ws.send(JSON.stringify({type: 'set-meta', meta: {name: name}}));
            },
            setLocalParticipantProperty: function(key, value) {
                var meta = {};
                meta[key] = value;
                ws.send(JSON.stringify({type: 'set-meta', meta: meta}));
            },
            sendTextMessage: function(text) {
                ws.send(JSON.stringify({type: 'say', payload: {type: 'chat', message: text}}));
            },
            broadcastEndpointMessage: function(msg) {
                ws.send(JSON.stringify({type: 'say', payload: msg}));
            },
            getParticipantCount: function() {
                return Object.keys(members).length;
            },
        };
    };

    ws.onmessage = function(event) {
        var msg = JSON.parse(event.data);
        if (msg.type === 'joined') {
            my_user_id = msg.userId;
            (msg.members || []).forEach(function(m) {
                if (m.userId === my_user_id) return;
                members[m.userId] = m;
                if ('undefined' === typeof(Game.heroes[m.userId])) {
                    var x = parseInt((m.meta || {}).left) || 0;
                    var y = parseInt((m.meta || {}).top) || 0;
                    Game.heroes[m.userId] = new Hero(map, x, y, (m.meta || {}).character, m.username);
                }
            });
            update_member_list();
            (msg.history || []).forEach(function(h) {
                if (h.type === 'say' && h.payload && h.payload.type === 'chat') {
                    var nick = h.username || 'unknown';
                    var text = h.payload.message;
                    $('#chat').val($.trim($('#chat').val() + "\n" + nick + ":" + text));
                    $('#chat').scrollTop($('#chat')[0].scrollHeight - $('#chat').height());
                }
            });
        } else if (msg.type === 'user-joined') {
            members[msg.userId] = {userId: msg.userId, username: msg.username, meta: msg.meta || {}};
            if ('undefined' === typeof(Game.heroes[msg.userId])) {
                var x = parseInt((msg.meta || {}).left) || 0;
                var y = parseInt((msg.meta || {}).top) || 0;
                Game.heroes[msg.userId] = new Hero(map, x, y, (msg.meta || {}).character, msg.username);
            }
            update_member_list();
        } else if (msg.type === 'user-left') {
            var id = msg.userId;
            delete members[id];
            delete Game.heroes[id];
            update_member_list();
        } else if (msg.type === 'say') {
            if (msg.userId === my_user_id) return;
            var id = msg.userId;
            var payload = msg.payload || {};
            if (payload.type === 'chat') {
                var nick = msg.username || (members[id] ? members[id].username : 'unknown');
                var text = payload.message;
                var ts_number = msg.timestamp ? new Date(msg.timestamp).getTime() : (new Date).getTime();
                $('#chat').val($.trim($('#chat').val() + "\n" + nick + ":" + text));
                $('#chat').scrollTop($('#chat')[0].scrollHeight - $('#chat').height());
                if ('undefined' !== typeof(Game.heroes[id])) {
                    if (ts_number + 20 * 1000 >= (new Date).getTime()) {
                        Game.heroes[id].messages.push([text, ts_number + 20 * 1000]);
                        if (Game.heroes[id].messages.length > 3)
                            Game.heroes[id].messages.shift();
                    }
                }
            } else if (payload.type === 'teleport') {
                if ('undefined' !== typeof(Game.heroes[id])) {
                    Game.heroes[id].x = Game.heroes[id].target_x = payload.message[0];
                    Game.heroes[id].y = Game.heroes[id].target_y = payload.message[1];
                }
            } else if (payload.type === 'announcement') {
                add_toast('公告', payload.message);
            }
        } else if (msg.type === 'meta-updated') {
            if (msg.userId === my_user_id) return;
            var id = msg.userId;
            if (!members[id]) {
                members[id] = {userId: id, username: msg.username || 'unknown', meta: {}};
            }
            Object.assign(members[id].meta, msg.meta || {});
            if (msg.username) members[id].username = msg.username;

            if ('undefined' !== typeof(Game.heroes[id])) {
                if (msg.meta && msg.meta.name) {
                    Game.heroes[id].name = msg.meta.name;
                }
                var x = parseInt(members[id].meta.left);
                var y = parseInt(members[id].meta.top);
                if (!Number.isNaN(x) && !Number.isNaN(y)) {
                    Game.heroes[id].target_x = x;
                    Game.heroes[id].target_y = y;
                    if (Game.heroes[id].x === 0 && Game.heroes[id].y === 0) {
                        Game.heroes[id].x = x;
                        Game.heroes[id].y = y;
                    }
                }
                if (msg.meta && msg.meta.character && Game.heroes[id].character !== members[id].meta.character) {
                    Game.heroes[id].changeCharacter(members[id].meta.character);
                    update_member_list();
                }
            }
            update_member_list();
        } else if (msg.type === 'error') {
            console.log('WS error:', msg.code);
        }
    };

    ws.onerror = function() {
        alert("連線失敗，請重新整理頁面再試一次。");
    };

    ws.onclose = function() {
        room = null;
    };

    connection = ws;
}

var startDate = new Date(Date.UTC(2020, 3, 21, 0, 45, 00));

function check_time() {
	if ($('#name').val().match(/g0vrock/) || Date.now() >= startDate) {
		$('#button-join').prop('disabled', false).text('進入會場');
		return;
	}
	var delta = Math.floor((startDate - Date.now()) / 1000);
	var h = Math.floor(delta / 3600);
	var m = Math.floor(delta / 60) % 60;
	var s = delta % 60;
	var t = '';
	if (h) {
		t += h + '小時';
	}
	if (m) {
		t += m + '分';
	}
	if (s) {
		t += s + '秒';
	}
    $("button#button-join").text('距離開放入場 4/21 08:45 還有 ' + t);
	setTimeout(check_time, 1000);
}

check_time();

function update_member_list() {
    for (var id in members) {
        var m = members[id];
        if ('undefined' === typeof(Game.heroes[id])) {
            var x = parseInt((m.meta || {}).left) || 0;
            var y = parseInt((m.meta || {}).top) || 0;
            Game.heroes[id] = new Hero(map, x, y, (m.meta || {}).character, m.username);
        }
    }
    $('#member-list').html('');
    c = 0;
    for (var id in Game.heroes) {
        var li_dom = $('<li></li>');
        var span_dom = $('<span></span>').css({
            width: 32,
            height: 32,
            display: 'inline-block',
            'background-image': 'url("sprite/' + Game.heroes[id].character + '.png")',
            'background-position': '0px 0px',
        });
        li_dom.append(span_dom);
        li_dom.append($('<span></span>').text(Game.heroes[id].name));

        $('#member-list').append(li_dom);
        c ++;
    }
    $('#member-count').text(c);
    $('#member-count-alt').text(c);
}

var add_object_step3_enable = function(id){
    var type = $('#form-add-object [name="type"]').val();
    $('#add-object-step-3').html($('#tmpl-object-param-' + type).html());
    if (type == 'npc') {
        characters.map(function(c) {
            $('#add-object-step-3 [name="character"]').append($('<option></option>').text(c));
        });
    }
    $('#add-object-step-3').show();
    if (id == 'preview') {
        Game.objects.preview = {
            type: type,
            x: parseInt($('#form-add-object [name="x"]').val()),
            y: parseInt($('#form-add-object [name="y"]').val()),
            data: {},
        };
        if (type == 'image' || type == 'iframe') {
            Game.objects.preview.x2 = parseInt($('#form-add-object [name="x2"]').val());
            Game.objects.preview.y2 = parseInt($('#form-add-object [name="y2"]').val());
        }
        $('#add-object-step-3 :input').each(function(){
            Game.objects.preview.data[$(this).attr('name')] = $(this).val();
        });
        $('#add-object-step-3 [type="submit"]').text('Add Object');
    } else {
        for (var k in Game.objects[id].data) {
            $('#add-object-step-3 [name="' + k + '"]:input').val(Game.objects[id].data[k]);
        }
        $('#add-object-step-3 [type="submit"]').text('Edit Object');
    }
    $('#form-add-object').data('target', id);
};

var iframe_click = function(e){
	e.preventDefault();
    if ($(this).is('.max')) {
        if ($(this).is('.min-hide')) {
            $(this.parentNode).hide();
        } else {
            $('iframe', this.parentNode).css({
                position: 'relative',
                left: '0px',
                top: '0px',
                width: '100%',
                height: '100%',
                'z-index': 10,
            });
            $(this).css({
                position: 'absolute',
                left: '0px',
                top: '0px',
                width: '100%',
                height: '100%',
                'z-index': 15,
            });
        }
        $(this).removeClass('max');
    } else {
        $(this.parentNode).show();

        $('iframe', this.parentNode).css({
            position: 'fixed',
            left: '50px',
            top: '50px',
            width: $('body').width() - 100,
            height: window.innerHeight - 100,
            'z-index': 30,
        });
        $(this).css({
            position: 'fixed',
            left: '0px',
            top: '0px',
            width: $('body').width(),
            height: window.innerHeight,
            'z-index': 21,
        });
        $(this).addClass('max');
    }
};
$('body').on('click', '.iframe-div-area', function(e){ iframe_click.bind(this)(e); });
$('body').on('touchstart', '.iframe-div-area', function(e){ iframe_click.bind(this)(e); });

window_change = function(){

    $('#game').attr('width', width).attr('height', height);
    Game.camera.width = width;
    Game.camera.height = height;
    Game.camera.maxX = map.cols * map.tsize - width;
    Game.camera.maxY = map.rows * map.tsize - height;
};
$(window).resize(window_change);
$(window).on('orientationchange', window_change);

if ('ontouchstart' in window) {
	$('#arrow-controller').show();
	$('#arrow-controller img').on('touchstart', function(event){ 
		event.preventDefault();
		var e = event.originalEvent.touches[0];
		var offsetX = e.clientX - $(this).offset().left;
		var offsetY = e.clientY - $(this).offset().top;
		var width = $(this).width();
		var height = $(this).height();
		if (offsetY < height / 2) {
			if (offsetX > width / 3 && offsetX < 2 * width / 3) {
				Keyboard._keys[Keyboard.UP] = true;
			}
		} else {
			if (offsetX <= width / 3) {
				Keyboard._keys[Keyboard.LEFT] = true;
			} else if (offsetX <= 2 * width / 3) {
				Keyboard._keys[Keyboard.DOWN] = true;
			} else {
				Keyboard._keys[Keyboard.RIGHT] = true;
			}
		}
	}).on('touchend', function(e){ 
		Keyboard._keys[Keyboard.UP] = Keyboard._keys[Keyboard.DOWN] = Keyboard._keys[Keyboard.LEFT] = Keyboard._keys[Keyboard.RIGHT] =  false;
	});
}

var add_toast = function(title, body, color, callback, id){
    var dom = $($('#tmpl-toast').html());
    $('.mr-auto', dom).text(title);
    $('.toast-body', dom).text(body);
    if (id) {
        if ($('#toast-' + id).length) {
            return;
        }
        dom.attr('id', 'toast-' + id);
    }
    if (callback) {
        $('.toast-body', dom).append(
            $('<form></form>').append($('<button type="submit">OK</button>')).submit(function(e){
                e.preventDefault();
                callback();
                $(this).parents('.toast').find('.close').click();
            })
        );
    }
    $('rect', dom).attr('fill', color);
    $('#toast-area').append(dom);
    dom.toast('show');
};
